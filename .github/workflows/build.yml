name: Build & test iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "No Xcode 26 on this runner"; exit 1; }
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MyApp.xcodeproj -scheme MyApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Build app for iPhone (.ipa for Sideloadly)
        run: |
          set -o pipefail
          VERSION=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          xcodebuild archive \
            -project MyApp.xcodeproj -scheme MyApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee archive.log | xcbeautify --renderer github-actions
          mkdir -p ipa/Payload
          cp -R build/MyApp.xcarchive/Products/Applications/MyApp.app ipa/Payload/
          (cd ipa && zip -qr "../myapp_v${VERSION}_unsigned.ipa" Payload)
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: myapp-ipa
          path: "*.ipa"

      - name: Boot simulator and add a test video to its library
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:(t[0],"Pro" in t[1]["name"]))
          print(c[-1][1]["udid"]); print(c[-1][0], c[-1][1]["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl addmedia "$UDID" MyAppTests/Fixtures/sdr_1080p.mov

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MyApp.xcodeproj -scheme MyApp \
            -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 420 \
            2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Results
        if: always()
        run: |
          grep -E "\[TEST\]|error:|Test Case.*(passed|failed|skipped)" test.log | sort -u | head -60 || true
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots 2>/dev/null || true
          ls screenshots | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: screenshots
