name: Build & test iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "No Xcode 26 on this runner"; exit 1; }
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MyApp.xcodeproj -scheme MyApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Boot simulator, install app, grant photo access
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:(t[0],"Pro" in t[1]["name"]))
          print(c[-1][1]["udid"]); print(c[-1][0], c[-1][1]["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name "MyApp.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all com.example.myapp || true
          # simctl's grant doesn't reach PhotoKit's read/write access on newer simulators:
          # write the permission straight into the simulator's privacy database too.
          DB=~/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db
          echo "--- schema"; sqlite3 "$DB" ".schema access" | head -5
          for SVC in kTCCServicePhotos kTCCServicePhotosAdd; do
            sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('$SVC','com.example.myapp',0,2,2,1,0,strftime('%s','now'));" \
              || sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SVC','com.example.myapp',0,2,2,1);"
          done
          echo "--- rows"; sqlite3 "$DB" "SELECT service, client, auth_value FROM access WHERE client='com.example.myapp';"
          # privacy service caches decisions: restart the simulator so it reads the new rows
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MyApp.xcodeproj -scheme MyApp \
            -destination "id=$UDID" -derivedDataPath build \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            2>&1 | tee test.log | xcbeautify --renderer github-actions
      - name: Results
        if: always()
        run: |
          grep -E "\[TEST\]|error:|Test Case.*(passed|failed)" test.log | sort -u | head -60 || true
