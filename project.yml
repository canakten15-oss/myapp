# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: MyApp
options:
  bundleIdPrefix: com.example            # TODO: change to your reverse domain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Ads are OFF by default so the project builds without any third-party code.
# To enable them, uncomment the two package blocks below (see docs/MONETIZATION.md).
# packages:
#   GoogleMobileAds:
#     url: https://github.com/googleads/swift-package-manager-google-mobile-ads
#     from: "12.0.0"
#   GoogleUserMessagingPlatform:
#     url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
#     from: "3.0.0"

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp
    # dependencies:
    #   - package: GoogleMobileAds
    #   - package: GoogleUserMessagingPlatform
    #     product: UserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp   # TODO
        MARKETING_VERSION: "0.9.1"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""                              # TODO: your Apple team ID
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MyApp/Info.plist
      properties:
        CFBundleDisplayName: Slash
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Slash needs access to your videos to make smaller copies of them. Everything stays on your device."
        NSPhotoLibraryAddUsageDescription: "Slash saves the smaller copy of each video to your library."
        NSUserTrackingUsageDescription: "Allowing this lets the free version show more relevant ads. The app works the same either way."
        # Google's public TEST app ID. Replace with your AdMob app ID before release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        ITSAppUsesNonExemptEncryption: false
        # iOS 26 continued processing: batches keep running when the app is left
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).batch.*

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyAppTests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyApp.app/MyApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MyAppUITests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: MyApp

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
        MyAppTests: [test]
        MyAppUITests: [test]
    test:
      config: Debug
      targets:
        - MyAppTests
        - MyAppUITests
